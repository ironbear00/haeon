<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root { --brand:#4F46E5; --bg:#f7f7f9; --card:#ffffff; --border:#e6e6ef; --text:#111827; }
        * { box-sizing: border-box; }
        body { margin:0; font-family: system-ui,-apple-system,Segoe UI,Roboto,Noto Sans KR,sans-serif; background:var(--bg); color:var(--text); }
        header, footer { background:var(--card); border-bottom:1px solid var(--border); padding:16px 20px; }
        main { max-width:520px; margin:40px auto; background:var(--card); padding:24px; border-radius:12px; box-shadow:0 10px 24px rgba(0,0,0,.05); }
        label { display:block; margin:10px 0 6px; font-weight:600; }
        input, select { width:100%; padding:12px; border:1px solid var(--border); border-radius:8px; }
        button { width:100%; padding:12px; border:0; border-radius:8px; background:var(--brand); color:#fff; font-weight:700; cursor:pointer; margin-top:12px; }
        button[disabled]{ opacity:.6; cursor:not-allowed; }
        .msg { margin-top:12px; font-size:14px; min-height:20px; }
        .msg.error { color:#B91C1C; } .msg.success { color:#065F46; }
    </style>
</head>
<body>
<header>
    <a href="main.html" style="text-decoration:none;color:inherit;">
        <h1>헤온🤝</h1>
    </a>
    <h1>회원가입</h1>
</header>

<main>
    <form id="signupForm">
        <label for="name">이름</label>
        <input id="name" name="name" type="text" placeholder="이름" required />

        <label for="email">이메일</label>
        <input id="email" name="email" type="email" placeholder="email@example.com" required />

        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" placeholder="비밀번호" required />

        <!-- 전화번호 -->
        <label for="phone">전화번호</label>
        <!-- [수정] 태그를 한 줄로 정확히 닫고, 주석 제거 -->
        <input id="phone" name="phone" type="tel" placeholder="010-1234-5678"
               inputmode="tel" pattern="^\d{2,3}-\d{3,4}-\d{4}$" title="010-1234-5678 형식" required /> <!-- [수정] -->

        <!-- 생년월일 -->
        <label for="birthDate">생년월일</label>
        <input id="birthDate" name="birthDate" type="date" required /> <!-- [수정] -->

        <!-- 성별 -->
        <label for="gender">성별</label>
        <select id="gender" name="gender" required> <!-- [수정] -->
            <option value="">선택 안 함</option>
            <option value="FEMALE">여성</option>  <!-- [수정] 대문자 -->
            <option value="MALE">남성</option>    <!-- [수정] 대문자 -->
            <option value="OTHER">기타</option>   <!-- [수정] 대문자 -->
        </select>

        <button id="signupBtn" type="submit">회원가입</button>
        <div id="message" class="msg" aria-live="polite"></div>
    </form>
</main>

<footer>
    <p style="padding:16px 20px;"><a href="login.html">로그인으로 돌아가기</a></p>
</footer>

<script>
    const API_BASE = "http://localhost:8080";
    const SIGNUP_ENDPOINT = API_BASE + "/api/auth/signup";
    const LOGIN_ENDPOINT  = API_BASE + "/api/auth/login";
    const REDIRECT_AFTER  = "main.html";

    const form = document.getElementById("signupForm");
    const btn  = document.getElementById("signupBtn");
    const msg  = document.getElementById("message");
    function setMsg(t, type="error"){ msg.textContent=t; msg.className=`msg ${type}`; }

    async function parseBodyOnce(res){
        const ct = res.headers.get("content-type")||"";
        if (ct.includes("application/json")) return await res.json();
        const t = await res.text(); try{ return JSON.parse(t);}catch{return {message:t};}
    }
    async function extractErr(res){
        try{
            const ct = res.headers.get("content-type")||"";
            if (ct.includes("application/json")){ const d=await res.clone().json(); return d.message||JSON.stringify(d); }
            return await res.clone().text();
        }catch{ return res.status+" "+res.statusText; }
    }

    form.addEventListener("submit", async (e)=>{
        e.preventDefault();
        setMsg("", "");
        btn.disabled = true;

        const name      = document.getElementById("name").value.trim();
        const email     = document.getElementById("email").value.trim();
        const password  = document.getElementById("password").value;
        let   phone     = document.getElementById("phone").value.trim();
        const birthDate = document.getElementById("birthDate").value;   // "YYYY-MM-DD"
        let   gender    = document.getElementById("gender").value;      // MALE/FEMALE/OTHER

        if (!name || !email || !password){
            setMsg("이름, 이메일, 비밀번호는 필수입니다.");
            btn.disabled = false;
            return;
        }
        if (!phone || !birthDate || !gender){
            setMsg("전화번호/생년월일/성별을 입력하세요.");
            btn.disabled = false;
            return;
        }

        // 숫자만 저장하고 싶으면 주석 해제
        // phone = phone.replaceAll("-", "");

        // 혹시라도 소문자 들어오면 방어
        if (gender) gender = gender.toUpperCase();

        const payload = { name, email, password, phone, birthDate, gender };
        console.log("signup payload", payload); // [수정] 네트워크 탭 확인 전에 콘솔에서 즉시 확인

        try{
            let res = await fetch(SIGNUP_ENDPOINT, {
                method:"POST",
                headers:{"Content-Type":"application/json"},
                credentials:"include",
                body: JSON.stringify(payload)
            });
            const signData = await parseBodyOnce(res);
            if(!res.ok) throw new Error(signData?.message || await extractErr(res));

            // 자동 로그인
            res = await fetch(LOGIN_ENDPOINT, {
                method:"POST",
                headers:{"Content-Type":"application/json"},
                credentials:"include",
                body: JSON.stringify({ email, password })
            });
            const loginData = await parseBodyOnce(res);
            if(!res.ok) throw new Error(loginData?.message || await extractErr(res));

            setMsg("회원가입 및 로그인 성공! 메인으로 이동합니다.", "success");
            window.location.href = REDIRECT_AFTER;
        }catch(err){
            setMsg("회원가입 실패: " + (err?.message || "서버 오류"));
        }finally{
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
