<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>메인 페이지 - 고인 SNS 정리 서비스</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root { --brand:#4F46E5; --bg:#f7f7f9; --card:#ffffff; --border:#e6e6ef; --text:#111827; --muted:#6b7280; }
        * { box-sizing: border-box; }
        body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans KR, sans-serif; background: var(--bg); color: var(--text); }
        header, footer { background: var(--card); border-bottom:1px solid var(--border); padding:16px 20px; }
        header h1 { margin:0; font-size:20px; }
        nav { padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--border); display: flex; justify-content: flex-start; gap: 20px; }
        nav a { text-decoration: none; color: var(--text); font-weight: 500; }
        main { max-width:800px; margin:40px auto; background:var(--card); padding:24px; border-radius:12px; box-shadow:0 10px 24px rgba(0,0,0,.05); }
        .row { display:flex; justify-content:space-between; align-items:center; }
        .user-status { display: flex; align-items: center; gap: 10px; }
        .user-status-item { font-size: 15px; color: var(--text); font-weight: 500; }
        .user-status-btn { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: none; cursor: pointer; color: var(--brand); text-decoration: none; }
        .logout-btn { padding: 8px 12px; border: none; background: var(--brand); color: #fff; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
<header class="row">
    <a href="main.html" style="text-decoration:none;color:inherit;">
        <h1>헤온 🤝</h1>
    </a>
    <div id="authStatus" class="user-status">
    </div>
</header>
<nav>
    <a href="dashboard.html">디지털 자산 관리</a>
    <a href="memorial.html">온라인 추모 공간</a>
    <a href="process.html">절차 안내</a>
    <a href="about.html">회사소개</a>
</nav>
<main>
    <h2>주요 기능</h2>
    <ul>
        <li>
            <h3>디지털 자산 관리</h3>
            <p>고인의 SNS 계정 및 디지털 흔적을 안전하게 정리해 드립니다.</p>
        </li>
        <li>
            <h3>온라인 추모 공간</h3>
            <p>소중한 사람을 추억하고, 따뜻한 마음을 나누는 공간을 제공합니다.</p>
        </li>
    </ul>
</main>
<footer>
    <p>&copy; 2025 해커톤 팀. 모든 권리 보유.</p>
</footer>
<script>
    const API_BASE = "http://localhost:8080";
    const ME_ENDPOINT = API_BASE + "/api/users/me";
    const LOGOUT_ENDPOINT = API_BASE + "/api/users/logout";

    const authStatus = document.getElementById("authStatus");

    async function fetchMe() {
        try {
            const res = await fetch(ME_ENDPOINT, { credentials: "include" });
            console.log("Fetch user info status:", res.status);

            if (!res.ok) {
                console.log("Not logged in. Redirecting to login page.");
                window.location.href = '/login.html';
                return null;
            }

            const user = await res.json();
            console.log("Logged in user:", user);
            return user;

        } catch (err) {
            console.error("Failed to fetch user info:", err);
            window.location.href = '/login.html';
            return null;
        }
    }

    function updateUI(user) {
        authStatus.innerHTML = "";
        if (user) {
            authStatus.innerHTML = `
                <span class="user-status-item">${user.name}님</span>
                <button id="logoutBtn" class="logout-btn">로그아웃</button>
            `;
            document.getElementById("logoutBtn").addEventListener("click", async () => {
                await fetch(LOGOUT_ENDPOINT, { method: "POST", credentials: "include" });
                window.location.reload();
            });
        } else {
            authStatus.innerHTML = `
                <a class="user-status-btn" href="login.html">로그인</a>
                <a class="user-status-btn" href="signup.html">회원가입</a>
            `;
        }
    }

    (async () => {
        const user = await fetchMe();
        updateUI(user);
    })();
</script>
</body>
</html>
