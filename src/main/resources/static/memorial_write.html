<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>추모글 작성하기</title>
</head>
<body>
<header>
    <a href="main.html">
        <h1>헤온🤝</h1>
    </a>
    <h1>새로운 추모공간 만들기</h1>
</header>

<nav>
    <a href="dashboard.html">디지털 자산 관리</a>
    <a href="memorial.html">온라인 추모 공간</a>
    <a href="main.html">로그아웃</a>
</nav>

<main>
    <form>
        <h2>고인 정보</h2>
        <p>
            <label for="deceased_name">성함:</label>
            <input type="text" id="deceased_name" name="deceased_name">
        </p>
        <p>
            <label for="birth_date">생년월일:</label>
            <input type="date" id="birth_date" name="birth_date">
        </p>
        <p>
            <label for="death_date">사망일:</label>
            <input type="date" id="death_date" name="death_date">
        </p>

        <h2>추모글 내용</h2>
        <textarea id="memorial_post" name="memorial_post" rows="10" cols="50" placeholder="고인을 추억하는 글을 작성해 주세요."></textarea>

        <a href='memorial.html'>등록하기</a>
    </form>
</main>

<footer>
    <p><a href="memorial.html">목록으로 돌아가기</a></p>
</footer>
</body>
</html>
