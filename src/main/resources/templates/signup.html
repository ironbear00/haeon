<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>회원가입 - 헤온</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/signup.css}" />
</head>
<body>

<div th:replace="~{common/header :: headerFragment}"></div>

<main>
    <h2>회원가입</h2>
    <form id="signupForm">
        <label for="name">이름</label>
        <input id="name" name="name" type="text" placeholder="이름" required />

        <label for="email">이메일</label>
        <input id="email" name="email" type="email" placeholder="email@example.com" required />

        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" placeholder="비밀번호" required />

        <label for="phone">전화번호</label>
        <input id="phone" name="phone" type="tel" placeholder="010-1234-5678"
               inputmode="tel" pattern="^\d{2,3}-\d{3,4}-\d{4}$" title="010-1234-5678 형식" required />

        <label for="birthDate">생년월일</label>
        <input id="birthDate" name="birthDate" type="date" required />

        <label for="gender">성별</label>
        <select id="gender" name="gender" required>
            <option value="">선택 안 함</option>
            <option value="FEMALE">여성</option>
            <option value="MALE">남성</option>
            <option value="OTHER">기타</option>
        </select>

        <button id="signupBtn" type="submit">회원가입</button>
        <div id="message" class="msg" aria-live="polite"></div>
    </form>

    <div class="row">
        <span class="muted">이미 계정이 있으신가요?</span>
        <a class="link" href="/user/login">로그인하기</a>
    </div>
</main>

<div th:replace="~{common/footer :: footerFragment}"></div>

    const form = document.getElementById("signupForm");
    const btn  = document.getElementById("signupBtn");
    const msg  = document.getElementById("message");
    function setMsg(t, type="error"){ msg.textContent=t; msg.className=`msg ${type}`; }

    async function parseBodyOnce(res){
        const ct = res.headers.get("content-type")||"";
        if (ct.includes("application/json")) return await res.json();
        const t = await res.text(); try{ return JSON.parse(t);}catch{return {message:t};}
    }
    async function extractErr(res){
        try{
            const ct = res.headers.get("content-type")||"";
            if (ct.includes("application/json")){ const d=await res.clone().json(); return d.message||JSON.stringify(d); }
            return await res.clone().text();
        }catch{ return res.status+" "+res.statusText; }
    }

    form.addEventListener("submit", async (e)=>{
        e.preventDefault();
        setMsg("", "");
        btn.disabled = true;

        const name      = document.getElementById("name").value.trim();
        const email     = document.getElementById("email").value.trim();
        const password  = document.getElementById("password").value;
        let   phone     = document.getElementById("phone").value.trim();
        const birthDate = document.getElementById("birthDate").value;
        let   gender    = document.getElementById("gender").value;

        if (!name || !email || !password || !phone || !birthDate || !gender){
            setMsg("모든 항목을 입력해주세요.");
            btn.disabled = false; return;
        }

        try{
            let res = await fetch(SIGNUP_ENDPOINT, {
                method:"POST", headers:{"Content-Type":"application/json"},
                credentials:"include", body: JSON.stringify(payload)
            });
            const signData = await parseBodyOnce(res);
            if(!res.ok) throw new Error(signData?.message || await extractErr(res));

            res = await fetch(LOGIN_ENDPOINT, {
                method:"POST", headers:{"Content-Type":"application/json"},
                credentials:"include", body: JSON.stringify({ email, password })
            });
            const loginData = await parseBodyOnce(res);
            if(!res.ok) throw new Error(loginData?.message || await extractErr(res));

            setMsg("회원가입 및 로그인 성공! 메인으로 이동합니다.", "success");
            window.location.href = REDIRECT_AFTER;
        }catch(err){
            setMsg("회원가입 실패: " + (err?.message || "서버 오류"));
        }finally{
            btn.disabled = false;
        }
    });
</script>
