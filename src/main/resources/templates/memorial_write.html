<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <title>추모글 작성하기 - 헤온</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />

</head>
<body>
<div th:replace="~{common/header :: headerFragment}"></div>

<main>
    <h2>추모글 작성</h2>

    <form th:action="@{/memorial/write}" method="post" enctype="multipart/form-data">
        <section style="border:1px solid #ddd; padding:12px; margin-bottom:16px;">
            <h3>고인 선택</h3>
            <p>
                <label for="deceasedId">고인</label>
                <select id="deceasedId" name="deceasedId" required>
                    <option value="" disabled th:selected="${preselectedId} == null">고인을 선택하세요</option>
                    <option th:each="d : ${deceasedList}"
                            th:value="${d.id}"
                            th:selected="${preselectedId != null and preselectedId == d.id}"
                            th:text="${d.name} + ' (' + (d.birthDate != null ? d.birthDate : '-') + ' ~ ' + (d.deathDate != null ? d.deathDate : '-') + ')'">
                    </option>
                </select>
                <a href="/deceased/create" class="btn btn-sm">+ 고인 등록</a>
            </p>
            <small>목록에 없다면 “+ 고인 등록”으로 먼저 등록해 주세요.</small>
        </section>

        <section>
            <h3>추모글</h3>
            <p>
                <label for="title">제목</label>
                <input type="text" id="title" name="title" placeholder="예: 故 ○○○님 추모공간" required>
            </p>
            <p>
                <label for="content">내용</label><br>
                <textarea id="content" name="content" rows="10" cols="50" placeholder="고인을 추억하는 글을 작성해 주세요." required></textarea>
            </p>
        </section>

        <section>
            <h3>고인 프로필 사진 (선택)</h3>
            <p>
                <label for="photo">사진 파일</label>
                <input type="file" id="photo" name="photo" accept="image/*">
            </p>
        </section>

        <section>
            <h3>접근 비밀번호 (필수)</h3>
            <p>
                <label for="accessPassword">접근 비밀번호</label>
                <input type="password" id="accessPassword" name="accessPassword" required minlength="4" maxlength="20" autocomplete="new-password" placeholder="비밀번호(4~20자)">
                <small>입장 시 필요한 비밀번호입니다. 4~20자로 설정하세요.</small>
            </p>
        </section>

        <button type="submit">등록하기</button>
    </form>
</main>

<div th:replace="~{common/footer :: footerFragment}"></div>

<script>
    const API_BASE = "http://localhost:8080";
    const ME_ENDPOINT = API_BASE + "/user/me";
    const LOGOUT_ENDPOINT = API_BASE + "/user/logout";

    function updateTitlePlaceholder() {
        const sel = document.getElementById('deceasedId');
        const title = document.getElementById('title');
        if (!sel || !title) return;
        const opt = sel.options[sel.selectedIndex];
        if (!opt || !opt.value) {
            title.placeholder = '예: 故 ○○○님 추모공간';
            return;
        }
        const text = opt.text || '';
        const name = text.split('(')[0].trim();
        if (name) title.placeholder = `예: 故 ${name}님 추모공간`;
    }

    // CSRF 토큰을 메타 태그에서 읽어오는 함수
    function getCsrfToken() {
        const token = document.querySelector("meta[name='_csrf']").content;
        const header = document.querySelector("meta[name='_csrf_header']").content;
        return { token, header };
    }

    document.addEventListener("DOMContentLoaded", async function () {
        const sel = document.getElementById('deceasedId');
        if (sel) {
            updateTitlePlaceholder();
            sel.addEventListener('change', updateTitlePlaceholder);
        }

        const authStatus = document.getElementById("authStatus");
        if (authStatus) {
            try {
                const res = await fetch(ME_ENDPOINT, { credentials: "include" });
                const user = res.ok ? await res.json() : null;
                authStatus.innerHTML = "";
                if (user) {
                    authStatus.innerHTML = `
            <span class="user-status-item">${user.name}님</span>
            <button id="logoutBtn" class="logout-btn" type="button">로그아웃</button>
          `;
                    document.getElementById("logoutBtn")?.addEventListener("click", async () => {
                        const csrf = getCsrfToken();
                        await fetch(LOGOUT_ENDPOINT, {
                            method: "POST",
                            credentials: "include",
                            headers: {
                                [csrf.header]: csrf.token // CSRF 토큰을 헤더에 포함
                            }
                        });
                        window.location.reload();
                    });
                } else {
                    authStatus.innerHTML = `
            <a class="user-status-btn" href="/user/login">로그인</a>
            <a class="user-status-btn" href="/user/signup">회원가입</a>
          `;
                }
            } catch (e) {
                console.error(e);
            }
        }
    });
</script>
</body>
</html>
