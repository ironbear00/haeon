<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>고인 등록</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body class="container py-4">

<h1 class="mb-4">고인 등록</h1>

<form th:action="@{/deceased/create}" th:object="${deceased}" method="post">
    <div class="mb-3">
        <label class="form-label">이름</label>
        <input type="text" th:field="*{name}" class="form-control"/>
    </div>
    <div class="mb-3">
        <label class="form-label">연락처</label>
        <input type="text" th:field="*{phone}" class="form-control"/>
    </div>
    <div class="mb-3">
        <label class="form-label">생년월일</label>
        <input type="date" th:field="*{birthDate}" class="form-control"/>
    </div>
    <div class="mb-3">
        <label class="form-label">성별</label>
        <select th:field="*{gender}" class="form-control">
            <option value="MALE">남성</option>
            <option value="FEMALE">여성</option>
            <option value="OTHER">기타</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">사망일</label>
        <input type="date" th:field="*{deathDate}" class="form-control"/>
    </div>
    <div class="mb-3">
        <label class="form-label">장례일</label>
        <input type="date" th:field="*{funeralDate}" class="form-control"/>
    </div>
    <button type="submit" class="btn btn-primary">등록</button>
    <a href="/deceased" class="btn btn-secondary">취소</a>
</form>

</body>
</html>
