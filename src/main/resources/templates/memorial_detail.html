<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <title>추모공간 상세 - 헤온</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body>

<div th:replace="~{common/header :: headerFragment}"></div>

<main>
    <div id="deceased_info_detail">
        <img th:src="@{${post.deceasedPhotoPath}}" alt="고인 프로필 사진" style="width:200px; border-radius: 50%;">

        <p><strong>성함:</strong> <span th:text="|故 ${post.deceased.name}님|"></span></p>
        <p><strong>생년월일:</strong> <span th:text="${#temporals.format(post.deceased.birthDate, 'yyyy-MM-dd')}"></span></p>
        <p><strong>사망일:</strong> <span th:text="${#temporals.format(post.deceased.deathDate, 'yyyy-MM-dd')}"></span></p>
        <p><strong>추모글:</strong> <span th:text="${post.content}"></span></p>
    </div>

    <hr>

    <div id="comment_section">
        <h2>댓글 남기기</h2>

        <form th:action="@{/memorial/comment/{uuid}(uuid=${post.uuidLink})}" method="post">
            <p sec:authorize="isAnonymous()">
                <input type="text" name="authorName" placeholder="이름" required>
            </p>
            <p>
                <textarea name="content" placeholder="댓글을 남겨주세요." rows="3" cols="50" required></textarea>
            </p>
            <button type="submit">댓글 등록</button>
        </form>

        <h3>댓글 목록</h3>
        <div th:each="comment : ${post.comments}" style="border:1px solid #eee; padding:10px; margin-bottom:10px;">
            <p><strong><span th:text="${comment.author?.name ?: comment.authorName}"></span>:</strong> <span th:text="${comment.content}"></span></p>
        </div>

        <div th:if="${#lists.isEmpty(post.comments)}">
            <p>아직 작성된 댓글이 없습니다.</p>
        </div>
    </div>
    <p><a href="/memorial">목록으로 돌아가기</a></p>
</main>

<div th:replace="~{common/footer :: footerFragment}"></div>


</body>
</html>
