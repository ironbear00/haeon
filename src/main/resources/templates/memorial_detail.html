<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <title>추모공간 상세 - 헤온</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <style>
        #postContentEditor {
            width: 100%;
            height: 200px;
            resize: vertical;
        }
    </style>
</head>
<body>

<div th:replace="~{common/header :: headerFragment}"></div>

<main>
    <div id="deceased_info_detail">
        <img th:if="${post.deceasedPhotoPath != null}"
             th:src="${post.deceasedPhotoPath}"
             alt="고인 프로필 사진"
             style="width:200px; border-radius: 50%;">

        <p><strong>성함:</strong> <span th:text="|故 ${post.deceased.name}님|"></span></p>
        <p><strong>생년월일:</strong>
            <span th:text="${post.deceased.birthDate != null ? #temporals.format(post.deceased.birthDate, 'yyyy-MM-dd') : '-'}"></span>
        </p>
        
        <p><strong>사망일:</strong>
            <span th:text="${post.deceased.deathDate != null ? #temporals.format(post.deceased.deathDate, 'yyyy-MM-dd') : '-'}"></span>
        </p>

        <div id="postContentContainer">
            <p id="postContentDisplay"><strong>추모글:</strong> <span th:text="${post.content}"></span></p>
        </div>

        <div th:if="${#authentication.name == post.author.email}" style="margin-top: 20px;">
            <button type="button" id="editBtn">수정</button>
            <button type="button" id="deleteBtn" onclick="deletePost()">삭제</button>
            <button type="button" id="saveBtn" style="display:none;">저장</button>
            <button type="button" id="cancelBtn" style="display:none;">취소</button>
        </div>
    </div>

    <hr>

    <div id="comment_section">
        <h2>댓글 남기기</h2>

        <form th:action="@{/memorial/comment/{uuid}(uuid=${post.uuidLink})}" method="post">
            <p sec:authorize="isAnonymous()">
                <input type="text" name="authorName" placeholder="이름" required>
            </p>
            <p>
                <textarea name="content" placeholder="댓글을 남겨주세요." rows="3" cols="50" required></textarea>
            </p>
            <button type="submit">댓글 등록</button>
        </form>

        <h3>댓글 목록</h3>
        <div th:each="comment : ${post.comments}" style="border:1px solid #eee; padding:10px; margin-bottom:10px;">
            <p>
                <strong>
                    <span th:text="${comment.author != null ? comment.author.name : comment.authorName}"></span>:
                </strong>
                <span th:text="${comment.content}"></span>
            </p>
        </div>

        <div th:if="${#lists.isEmpty(post.comments)}">
            <p>아직 작성된 댓글이 없습니다.</p>
        </div>
    </div>

    <p><a href="/memorial">목록으로 돌아가기</a></p>
</main>

<div th:replace="~{common/footer :: footerFragment}"></div>

<script>
    const API_BASE = "http://localhost:8080";
    const ME_ENDPOINT = API_BASE + "/user/me";
    const LOGOUT_ENDPOINT = API_BASE + "/user/logout";

    function getCsrfToken() {
        const token = document.querySelector("meta[name='_csrf']").content;
        const header = document.querySelector("meta[name='_csrf_header']").content;
        return { token, header };
    }

    // 추모글 삭제 기능
    function deletePost() {
        if (confirm("정말로 이 추모글을 삭제하시겠습니까?")) {
            const csrf = getCsrfToken();
            const postUuid = '[[${post.uuidLink}]]';
            fetch(`/memorial/delete/${postUuid}`, {
                method: 'DELETE',
                headers: {
                    [csrf.header]: csrf.token
                }
            })
                .then(response => {
                    if (response.ok) {
                        alert("추모글이 삭제되었습니다.");
                        window.location.href = "/memorial";
                    } else {
                        alert("삭제에 실패했습니다. 권한이 없거나 오류가 발생했습니다.");
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("삭제 중 오류가 발생했습니다.");
                });
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        const authStatus = document.getElementById("authStatus");

        async function fetchMe() {
            try {
                const res = await fetch(ME_ENDPOINT, { credentials: "include" });
                if (res.ok) {
                    return await res.json();
                }
                return null;
            } catch (err) {
                console.error("Failed to fetch user info:", err);
                return null;
            }
        }

        function updateUI(user) {
            if (!authStatus) return;
            authStatus.innerHTML = "";
            if (user) {
                authStatus.innerHTML = `
                        <span class="user-status-item">${user.name}님</span>
                        <button id="logoutBtn" class="logout-btn" >로그아웃</button>
                    `;
                document.getElementById("logoutBtn").addEventListener("click", async () => {
                    const csrf = getCsrfToken();
                    await fetch(LOGOUT_ENDPOINT, {
                        method: "POST",
                        credentials: "include",
                        headers: {
                            [csrf.header]: csrf.token
                        }
                    });
                    window.location.reload();
                });
            } else {
                authStatus.innerHTML = `
                        <a class="user-status-btn" href="/user/login">로그인</a>
                        <a class="user-status-btn" href="/user/signup">회원가입</a>
                    `;
            }
        }
        (async () => {
            const user = await fetchMe();
            updateUI(user);
        })();

        // 인라인 편집 기능 로직
        const postContentContainer = document.getElementById("postContentContainer");
        const editBtn = document.getElementById("editBtn");
        const saveBtn = document.getElementById("saveBtn");
        const cancelBtn = document.getElementById("cancelBtn");

        if (editBtn) {
            editBtn.addEventListener("click", () => {
                const currentContentSpan = postContentContainer.querySelector("span");
                const currentContent = currentContentSpan ? currentContentSpan.innerText : '';

                const textarea = document.createElement("textarea");
                textarea.id = "postContentEditor";
                textarea.value = currentContent;

                postContentContainer.innerHTML = '';
                postContentContainer.appendChild(textarea);

                editBtn.style.display = "none";
                document.getElementById("deleteBtn").style.display = "none";
                saveBtn.style.display = "inline-block";
                cancelBtn.style.display = "inline-block";
            });
        }

        if (cancelBtn) {
            cancelBtn.addEventListener("click", () => {
                const originalContent = '[[${post.content}]]';
                postContentContainer.innerHTML = `<p id="postContentDisplay"><strong>추모글:</strong> <span>${originalContent}</span></p>`;

                editBtn.style.display = "inline-block";
                document.getElementById("deleteBtn").style.display = "inline-block";
                saveBtn.style.display = "none";
                cancelBtn.style.display = "none";
            });
        }

        if (saveBtn) {
            saveBtn.addEventListener("click", async () => {
                const csrf = getCsrfToken();
                const postUuid = '[[${post.uuidLink}]]';
                const newContent = document.getElementById("postContentEditor").value;

                try {
                    const res = await fetch(`/memorial/edit/${postUuid}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            [csrf.header]: csrf.token
                        },
                        body: JSON.stringify({ content: newContent })
                    });

                    if (res.ok) {
                        alert("추모글이 성공적으로 수정되었습니다.");
                        window.location.reload();
                    } else {
                        const errorData = await res.json();
                        alert("수정에 실패했습니다: " + errorData.message);
                    }
                } catch (error) {
                    console.error("Error:", error);
                    alert("수정 중 오류가 발생했습니다.");
                }
            });
        }
    });
</script>
</body>
</html>
