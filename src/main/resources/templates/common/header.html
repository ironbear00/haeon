<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="row" th:fragment="headerFragment">
    <a href="/" style="text-decoration:none;color:inherit;">
        <h1>헤온 🤝</h1>
    </a>

    <nav>
        <div class="dropdown">
            <a class="nav-item" href="/about">회사소개</a>
            <div class="dropdown-content">
                <a href="/process">절차 안내</a>
            </div>
        </div>

        <div class="dropdown">
            <span class="nav-item">디지털 자산 관리</span>
            <div class="dropdown-content">
                <a href="/requests/apply">계정정리 신청</a>
                <a href="/requests/dashboard">신청 현황</a>
                <a href="/deceased">고인 관리</a>
            </div>
        </div>

        <a class="nav-item" href="/memorial">온라인 추모 공간</a>
    </nav>

    <div id="authStatus" class="user-status">
        <!-- 로그인 상태 -->
        <div th:if="${session.LOGIN_USER_ID != null}">
            <a href="/mypage" style="text-decoration: none;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round" class="feather feather-user">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </a>
            <span class="user-status-item" th:text="${session.LOGIN_USER_NAME} + '님'">사용자님</span>
            <form th:action="@{/user/logout}" method="post" style="display:inline;">
                <button type="submit" class="logout-btn">로그아웃</button>
            </form>
        </div>

        <!-- 비로그인 상태 -->
        <div th:if="${session.LOGIN_USER_ID == null}">
            <a class="user-status-btn" href="/user/login">로그인</a>
            <a class="user-status-btn" href="/user/signup">회원가입</a>
        </div>
    </div>
</header>
</body>
</html>
