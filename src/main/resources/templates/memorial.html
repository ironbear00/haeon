<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>온라인 추모 공간 - 헤온</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body>

<div th:replace="~{common/header :: headerFragment}"></div>

<main>
    <h2>추모 게시판</h2>
    <a href="/memorial/memorial_write">추모글 작성하기</a>

    <div id="post_list">
        <div style="border:1px solid #ccc; padding:10px; margin-bottom:10px;">
            <h3><a href="/memorial/memorial_detail">故 OOO님 추모공간</a></h3>
            <p>소중한 사람을 추억하고, 따뜻한 마음을 나누는 공간입니다.</p>
            <small>게시자: 홍길동</small>
        </div>

        <div style="border:1px solid #ccc; padding:10px; margin-bottom:10px;">
            <h3><a href="/memorial/memorial_detail">故 001님 추모공간</a></h3>
            <p>아빠, 아빠 덕분에 행복했어요. 항상 저를 응원해 주셔서 감사합니다.</p>
            <small>게시자: 김철수</small>
        </div>
    </div>
</main>

<div th:replace="~{common/footer :: footerFragment}"></div>

<script>
    const API_BASE = "http://localhost:8080";
    const ME_ENDPOINT = API_BASE + "/user/me";
    const LOGOUT_ENDPOINT = API_BASE + "/user/logout";

    document.addEventListener("DOMContentLoaded", function() {
        const authStatus = document.getElementById("authStatus");

        async function fetchMe() {
            try {
                const res = await fetch(ME_ENDPOINT, { credentials: "include" });
                if (res.ok) {
                    return await res.json();
                }
                return null;
            } catch (err) {
                console.error("Failed to fetch user info:", err);
                return null;
            }
        }

        function updateUI(user) {
            if (!authStatus) return;

            authStatus.innerHTML = "";
            if (user) {
                authStatus.innerHTML = `
                        <span class="user-status-item">${user.name}님</span>
                        <button id="logoutBtn" class="logout-btn">로그아웃</button>
                    `;

                document.getElementById("logoutBtn").addEventListener("click", async () => {
                    await fetch(LOGOUT_ENDPOINT, { method: "POST", credentials: "include" });
                    window.location.reload();
                });
            } else {
                authStatus.innerHTML = `
                        <a class="user-status-btn" href="/user/login">로그인</a>
                        <a class="user-status-btn" href="/user/signup">회원가입</a>
                    `;
            }
        }

        (async () => {
            const user = await fetchMe();
            updateUI(user);
        })();
    });
</script>

</body>
</html>
