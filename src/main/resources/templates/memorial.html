<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <title>온라인 추모 공간 - 헤온</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body>

<div th:replace="~{common/header :: headerFragment}"></div>

<main>
    <h2>추모 게시판</h2>

    <!-- 로그인 상태: 작성 페이지로 이동 -->
    <a sec:authorize="isAuthenticated()" th:href="@{/memorial/memorial_write}">
        추모글 작성하기
    </a>

    <!-- 비로그인 상태: 로그인 페이지로 이동 -->
    <a sec:authorize="isAnonymous()" th:href="@{/user/login}">
        추모글 작성하기
    </a>

    <div id="post_list">
        <div th:each="post : ${postList}" style="border:1px solid #ccc; padding:10px; margin-bottom:10px;">
            <h3>
                <a th:href="@{/memorial/password_check/{uuid}(uuid=${post.uuidLink})}">
                    <span th:text="|故 ${post.title}님 추모공간|"></span>
                </a>
            </h3>
            <p th:text="${post.content}"></p>
            <small th:text="|게시자: ${post.author.name}|"></small>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(postList)}">
        <p>작성된 추모글이 없습니다.</p>
    </div>
</main>

<div th:replace="~{common/footer :: footerFragment}"></div>

<script>
    const API_BASE = "http://localhost:8080";
    const ME_ENDPOINT = API_BASE + "/user/me";
    const LOGOUT_ENDPOINT = API_BASE + "/user/logout";

    document.addEventListener("DOMContentLoaded", function() {
        const authStatus = document.getElementById("authStatus");

        async function fetchMe() {
            try {
                const res = await fetch(ME_ENDPOINT, { credentials: "include" });
                if (res.ok) {
                    return await res.json();
                }
                return null;
            } catch (err) {
                console.error("Failed to fetch user info:", err);
                return null;
            }
        }

        function updateUI(user) {
            if (!authStatus) return;

            authStatus.innerHTML = "";
            if (user) {
                authStatus.innerHTML = `
                        <span class="user-status-item">${user.name}님</span>
                        <button id="logoutBtn" class="logout-btn">로그아웃</button>
                    `;

                document.getElementById("logoutBtn").addEventListener("click", async () => {
                    await fetch(LOGOUT_ENDPOINT, { method: "POST", credentials: "include" });
                    window.location.reload();
                });
            } else {
                authStatus.innerHTML = `
                        <a class="user-status-btn" href="/user/login">로그인</a>
                        <a class="user-status-btn" href="/user/signup">회원가입</a>
                    `;
            }
        }

        (async () => {
            const user = await fetchMe();
            updateUI(user);
        })();
    });
</script>

</body>
</html>
