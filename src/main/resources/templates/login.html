<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>로그인</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root { --brand:#4F46E5; --bg:#f7f7f9; --card:#ffffff; --border:#e6e6ef; --text:#111827; --muted:#6b7280; }
        * { box-sizing: border-box; }
        body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans KR, sans-serif; background: var(--bg); color: var(--text); }
        header, footer { background: var(--card); border-bottom:1px solid var(--border); padding:16px 20px; }
        header h1 { margin:0; font-size:20px; }
        main { max-width:420px; margin:40px auto; background:var(--card); padding:24px; border-radius:12px; box-shadow:0 10px 24px rgba(0,0,0,.05); }
        h2 { margin:0 0 8px 0; }
        form p { margin:12px 0; }
        label { display:block; margin-bottom:6px; font-weight:600; }
        input[type="email"], input[type="password"] { width:100%; padding:12px; border:1px solid var(--border); border-radius:8px; font-size:15px; }
        button[type="submit"] { width:100%; padding:12px; border:0; border-radius:8px; background:var(--brand); color:#fff; font-size:16px; font-weight:700; cursor:pointer; }
        .msg { margin-top:12px; font-size:14px; min-height:20px; }
        .msg.error { color:#B91C1C; }
        .msg.success { color:#065F46; }
        .row { display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
        .link { color:var(--brand); text-decoration:none; }
    </style>
</head>
<body>
<header>
    <a href="main.html" style="text-decoration:none;color:inherit;">
        <h1>헤온 🤝</h1>
    </a>
</header>

<main>
    <h2>로그인</h2>
    <form id="loginForm" method="POST" action="/api/users/login">
        <p>
            <label for="username">이메일</label>
            <input id="username" name="username" type="email" placeholder="이메일을 입력하세요" required autocomplete="email" />
        </p>
        <p>
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" placeholder="비밀번호를 입력하세요" required autocomplete="current-password" />
        </p>
        <button type="submit">로그인하기</button>
        <div id="message" class="msg error" aria-live="polite"></div>
    </form>

    <div class="row">
        <span class="muted">계정이 없으신가요?</span>
        <a class="link" href="signup.html">회원가입하기</a>
    </div>
</main>

<footer>
    <p><a class="link" href="main.html">메인으로 돌아가기</a></p>
</footer>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const isError = urlParams.get('error');
    if (isError) {
        document.getElementById('message').textContent = '이메일 또는 비밀번호가 올바르지 않습니다.';
    }
</script>
</body>
</html>
