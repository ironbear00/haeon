    const API_BASE = "http://localhost:8080";
    const LOGIN_ENDPOINT = API_BASE + "/user/login"; // 경로 일관성을 위해 수정
    const REDIRECT_AFTER_LOGIN = "/main"; // Controller 경로에 맞게 수정

    const form = document.getElementById("loginForm");
    const btn  = document.getElementById("loginBtn");
    const msg  = document.getElementById("message");

    function setMessage(text, type="error"){
        msg.textContent = text;
        msg.className = `msg ${type}`;
    }

    async function parseBodyOnce(res) {
        const ct = res.headers.get("content-type") || "";
        if (ct.includes("application/json")) {
            return await res.json();
        } else {
            const text = await res.text();
            try { return JSON.parse(text); } catch { return { message: text }; }
        }
    }

    async function login(email, password){
        const res = await fetch(LOGIN_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ email, password })
        });

        if (!res.ok) {
            const data = await parseBodyOnce(res);
            throw new Error(data.message || "로그인에 실패했습니다.");
        }
        return await parseBodyOnce(res);
    }

    form.addEventListener("submit", async (e)=>{
        e.preventDefault();
        setMessage("", "");
        btn.disabled = true;

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if(!email || !password){
            setMessage("이메일과 비밀번호를 모두 입력하세요.");
