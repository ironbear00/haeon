<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>로그인 - 헤온</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/login.css}" />
</head>
<body>

<div th:replace="~{common/header :: headerFragment}"></div>

<main>
    <h2>로그인</h2>
    <form id="loginForm">
        <p>
            <label for="email">이메일</label>
            <input id="email" name="email" type="email" placeholder="이메일을 입력하세요" required autocomplete="email" />
        </p>
        <p>
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" placeholder="비밀번호를 입력하세요" required autocomplete="current-password" />
        </p>
        <button id="loginBtn" type="submit">로그인하기</button>
        <div id="message" class="msg" aria-live="polite"></div>
    </form>

    <div class="row">
        <span class="muted">계정이 없으신가요?</span>
        <a class="link" href="/user/signup">회원가입하기</a>
    </div>
</main>

<div th:replace="~{common/footer :: footerFragment}"></div>

<script>
    const API_BASE = "http://localhost:8080";
    const LOGIN_ENDPOINT = API_BASE + "/user/login";
    const REDIRECT_AFTER_LOGIN = "/main";

    const form = document.getElementById("loginForm");
    const btn  = document.getElementById("loginBtn");
    const msg  = document.getElementById("message");

    function setMessage(text, type="error"){
        msg.textContent = text;
        msg.className = `msg ${type}`;
    }

    async function parseBodyOnce(res) {
        const ct = res.headers.get("content-type") || "";
        if (ct.includes("application/json")) {
            return await res.json();
        } else {
            const text = await res.text();
            try { return JSON.parse(text); } catch { return { message: text }; }
        }
    }

    async function login(email, password){
        const res = await fetch(LOGIN_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ email, password })
        });

        if (!res.ok) {
            const data = await parseBodyOnce(res);
            throw new Error(data.message || "로그인에 실패했습니다.");
        }
        return await parseBodyOnce(res);
    }

    form.addEventListener("submit", async (e)=>{
        e.preventDefault();
        setMessage("", "");
        btn.disabled = true;

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if(!email || !password){
            setMessage("이메일과 비밀번호를 모두 입력하세요.");
            btn.disabled = false;
            return;
        }

        try{
            const user = await login(email, password);
            setMessage("로그인 성공! 메인으로 이동 중...", "success");
            window.location.href = REDIRECT_AFTER_LOGIN;
        }catch(err){
            setMessage("로그인 실패: " + (err?.message || "서버 오류"));
        }finally{
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
