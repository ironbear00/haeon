<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>메인 페이지 - 고인 SNS 정리 서비스</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body>

<div th:replace="~{common/header :: headerFragment}"></div>

<main>
    <h2>주요 기능</h2>
    <ul>
        <li>
            <h3>디지털 자산 관리</h3>
            <p>고인의 SNS 계정 및 디지털 흔적을 안전하게 정리해 드립니다.</p>
        </li>
        <li>
            <h3>온라인 추모 공간</h3>
            <p>소중한 사람을 추억하고, 따뜻한 마음을 나누는 공간을 제공합니다.</p>
        </li>
    </ul>
</main>

<div th:replace="~{common/footer :: footerFragment}"></div>

<script>
    const API_BASE = "http://localhost:8080";
    const ME_ENDPOINT = API_BASE + "/user/me";
    const LOGOUT_ENDPOINT = API_BASE + "/user/logout";

    document.addEventListener("DOMContentLoaded", function() {
        const authStatus = document.getElementById("authStatus");

        async function fetchMe() {
            try {
                const res = await fetch(ME_ENDPOINT, { credentials: "include" });

                // HTTP 상태 코드가 403 (Forbidden)일 경우 로그인 페이지로 리디렉션
                if (res.status === 403) {
                    window.location.href = "/user/login";
                    return null;
                }

                if (res.ok) {
                    return await res.json();
                }
                return null;
            } catch (err) {
                console.error("Failed to fetch user info:", err);
                return null;
            }
        }

        function updateUI(user) {
            if (!authStatus) return;

            authStatus.innerHTML = "";
            if (user) {
                authStatus.innerHTML = `
                        <span class="user-status-item">${user.name}님</span>
                        <button id="logoutBtn" class="logout-btn">로그아웃</button>
                    `;

                document.getElementById("logoutBtn").addEventListener("click", async () => {
                    await fetch(LOGOUT_ENDPOINT, { method: "POST", credentials: "include" });
                    window.location.reload();
                });
            } else {
                authStatus.innerHTML = `
                        <a class="user-status-btn" href="/user/login">로그인</a>
                        <a class="user-status-btn" href="/user/signup">회원가입</a>
                    `;
            }
        }

        (async () => {
            const user = await fetchMe();
            updateUI(user);
        })();
    });
</script>
</body>
</html>
