<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>신청 현황 - 헤온</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" /> </head>
<body>

<div th:replace="~{common/header :: headerFragment}"></div>

<main>
    <h2>신청 진행 상황</h2>

    <table>
        <thead>
        <tr>
            <th>플랫폼</th>
            <th>상태</th>
            <th>신청일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${!requests.isEmpty()}" th:each="req : ${requests}">
            <td th:text="${req.platformName}">페이스북</td>
            <td>
                <span class="status"
                      th:classappend="${req.status == 'SUBMITTED' ? 'submitted' : 'completed'}"
                      th:text="${req.status == 'SUBMITTED' ? '처리 중' : '완료'}">처리 중</span>
            </td>
            <td th:text="${req.createdAt}">2025.07.28</td>
        </tr>
        <tr th:if="${requests.isEmpty()}">
            <td colspan="3" class="empty-message">신청 내역이 없습니다.</td>
        </tr>
        </tbody>
    </table>
</main>

<div th:replace="~{common/footer :: footerFragment}"></div>

<script th:src="@{/js/common.js}"></script>

</body>
</html>
