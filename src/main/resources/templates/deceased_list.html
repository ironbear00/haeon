<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>고인 목록 - 헤온</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body>

<div th:replace="~{common/header :: headerFragment}"></div>

<main class="container py-4">

    <h1 class="mb-4">고인 목록</h1>

    <a href="/deceased/create" class="btn btn-primary mb-3">+ 고인 등록</a>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>이름</th>
            <th>연락처</th>
            <th>생년월일</th>
            <th>성별</th>
            <th>사망일</th>
            <th>장례일</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${deceasedList}">
            <td th:text="${d.id}"></td>
            <td th:text="${d.name}"></td>
            <td th:text="${d.phone}"></td>
            <td th:text="${d.birthDate}"></td>
            <td th:text="${d.gender}"></td>
            <td th:text="${d.deathDate}"></td>
            <td th:text="${d.funeralDate}"></td>
            <td>
                <a th:href="@{/deceased/edit(id=${d.id})}" class="btn btn-sm btn-warning">수정</a>
                <form th:action="@{/deceased/delete(id=${d.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-sm btn-danger">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</main>

<div th:replace="~{common/footer :: footerFragment}"></div>

<script th:src="@{/js/common.js}"></script>

</body>
</html>
