<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>고인 목록 - 헤온</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body>

<div th:replace="~{common/header :: headerFragment}"></div>

<main class="container py-4">

    <h1 class="mb-4">고인 목록</h1>

    <a href="/deceased/create" class="btn btn-primary mb-3">+ 고인 등록</a>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>이름</th>
            <th>연락처</th>
            <th>생년월일</th>
            <th>성별</th>
            <th>사망일</th>
            <th>장례일</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${deceasedList}">
            <td th:text="${d.id}">1</td>
            <td th:text="${d.name}">홍길동</td>
            <td th:text="${d.phone}">010-0000-0000</td>
            <td th:text="${d.birthDate != null ? #temporals.format(d.birthDate,'yyyy-MM-dd') : '-'}">-</td>
            <td th:text="${d.gender}">MALE</td>
            <td th:text="${d.deathDate != null ? #temporals.format(d.deathDate,'yyyy-MM-dd') : '-'}">-</td>
            <td th:text="${d.funeralDate != null ? #temporals.format(d.funeralDate,'yyyy-MM-dd') : '-'}">-</td>
            <td>
                <div style="display:flex; gap:6px; flex-wrap:wrap;">
                    <a th:href="@{/deceased/edit(id=${d.id})}" class="btn btn-sm btn-warning">수정</a>

                    <form th:action="@{/deceased/delete(id=${d.id})}" method="post" style="display:inline"
                          onsubmit="return confirm('정말 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.');">
                        <button type="submit" class="btn btn-sm btn-danger">삭제</button>
                    </form>

                    <!-- ✔ 추모글 작성 버튼 -->
                    <a th:href="@{/memorial/memorial_write(deceasedId=${d.id})}"
                       class="btn btn-sm btn-success">추모글 작성</a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(deceasedList)}" class="mt-3">
        등록된 고인이 없습니다. 먼저 <a href="/deceased/create">고인 등록</a>을 해주세요.
    </div>

</main>

<div th:replace="~{common/footer :: footerFragment}"></div>

<script th:src="@{/js/common.js}"></script>

</body>
</html>
